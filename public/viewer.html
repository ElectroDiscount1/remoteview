<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote View</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111; color:#eee; font-family:system-ui,sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:10px; align-items:center; padding:10px 14px; background:#1c1c1e; flex-wrap:wrap; }
  input { font-size:20px; letter-spacing:4px; text-transform:uppercase; width:7em; padding:6px 10px; border-radius:8px; border:1px solid #444; background:#000; color:#fff; }
  button { font-size:16px; padding:8px 14px; border-radius:8px; border:0; background:#3b82f6; color:#fff; cursor:pointer; }
  button.secondary { background:#333; }
  #status { margin-left:auto; font-size:14px; opacity:.85; }
  main { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  canvas { max-width:100%; max-height:100%; background:#000; }
</style>
</head>
<body>
<header>
  <input id="code" maxlength="6" placeholder="CODE" autofocus>
  <button id="go">Connect</button>
  <button id="full" class="secondary">Fullscreen</button>
  <span id="status">Enter the 6-character code shown on the TV</span>
</header>
<main><canvas id="c" width="1280" height="720"></canvas></main>
<script>
const $ = (id) => document.getElementById(id);
const canvas = $('c'), ctx = canvas.getContext('2d');
let ws = null, wantCode = null, retry = null, pending = null, decoding = false;

function setStatus(t) { $('status').textContent = t; }

function connect(code) {
  clearTimeout(retry);
  if (ws) { ws.onclose = null; ws.close(); }
  wantCode = code;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?role=viewer&code=${code}`);
  ws.binaryType = 'blob';
  setStatus('Connecting...');
  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const s = JSON.parse(e.data).status;
      if (s === 'tv-online') setStatus('Connected. Watching the TV');
      else if (s === 'tv-offline') setStatus('TV went offline, waiting for it to return...');
      else if (s === 'no-such-code') { setStatus('Code not found. Check it and try again.'); wantCode = null; }
      else if (s === 'rate-limited') { setStatus('Too many wrong tries. Wait a minute.'); wantCode = null; }
    } else { pending = e.data; decode(); }
  };
  ws.onclose = () => {
    if (wantCode) { setStatus('Connection lost, retrying...'); retry = setTimeout(() => connect(wantCode), 2000); }
  };
}

async function decode() {
  if (decoding) return;
  decoding = true;
  while (pending) {
    const blob = pending; pending = null;
    try {
      const bmp = await createImageBitmap(blob);
      if (canvas.width !== bmp.width || canvas.height !== bmp.height) { canvas.width = bmp.width; canvas.height = bmp.height; }
      ctx.drawImage(bmp, 0, 0);
      bmp.close();
    } catch (err) {}
  }
  decoding = false;
}

$('go').onclick = () => { const c = $('code').value.trim().toUpperCase(); if (c.length === 6) connect(c); else setStatus('Code must be 6 characters'); };
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
$('full').onclick = () => { (canvas.requestFullscreen || canvas.webkitRequestFullscreen).call(canvas); };
</script>
</body>
</html>
